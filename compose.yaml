services:
  sage-chat:
    build: .
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    environment:
      INFERENCE_URL: "${INFERENCE_URL:-http://host.docker.internal:11434/v1}"
      INFERENCE_API_KEY: "${INFERENCE_API_KEY:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sage-data:/data
      - ./plugins:/data/plugins:ro

volumes:
  sage-data:
