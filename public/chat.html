  <div class="sidebar-controls">
    <div class="sidebar-heading">
      <div class="brand sidebar-label">
        <span class="brand-mark"><svg aria-hidden="true"><use href="/icons.svg#logo"/></svg></span>
        <span>Serenity</span>
      </div>
      <button type="button" class="icon sidebar-toggle" id="sidebar-toggle" title="Hide sidebar" aria-label="Hide sidebar" aria-controls="sidebar" aria-expanded="true"><svg aria-hidden="true"><use class="panel-open" href="/icons.svg#panel-open"/><use class="panel-closed" href="/icons.svg#panel-closed"/></svg></button>
    </div>
    <button type="button" class="new-chat" id="new-chat" title="New chat" aria-label="New chat"><svg aria-hidden="true"><use href="/icons.svg#chat-plus"/></svg><span class="sidebar-label">New chat</span></button>
  </div>

  <aside class="sidebar" id="sidebar" aria-label="Chat sidebar">
    <div class="history-heading">
      <h2>Conversations</h2>
      <button type="button" class="history-bulk-delete" id="delete-selected" aria-keyshortcuts="Delete Meta+Backspace" hidden></button>
    </div>
    <nav id="history" aria-label="Conversations"></nav>
  </aside>
  <div class="sidebar-footer">
    <button type="button" class="settings-button" data-open-settings title="Settings" aria-label="Settings"><svg aria-hidden="true"><use href="/icons.svg#gear"/></svg><span class="sidebar-label">Settings</span></button>
  </div>
  <div id="scrim" class="scrim" aria-hidden="true"></div>

  <main id="chat-main">
    <div class="stage" id="stage">
      <section class="thread" id="thread" aria-label="Messages" tabindex="0" hidden></section>
      <div class="intro">
        <div class="intro-mark"><svg aria-hidden="true"><use href="/icons.svg#logo"/></svg></div>
        <h1>Ask a question</h1>
      </div>
    </div>

    <div class="dock">
      <div class="model-notice" id="model-notice" hidden><span id="model-error"></span><button type="button" id="retry-models">Retry</button><button type="button" data-open-settings>Settings</button></div>
      <div class="status" id="status" role="status"></div>
      <div class="visually-hidden" id="chat-announcement" role="status"></div>
      <ul class="follow-ups" id="follow-ups" aria-label="Pending messages" hidden></ul>
      <form class="composer" id="composer">
        <div id="attachments" class="attachments" hidden></div>
        <textarea id="prompt" aria-label="Message" placeholder="Message…" rows="1" maxlength="100000"></textarea>
        <div class="composer-actions">
          <input id="files" type="file" multiple hidden>
          <button type="button" class="icon" id="attach" title="Attach files" aria-label="Attach files"><svg><use href="/icons.svg#plus"/></svg></button>
          <div>
            <button type="button" class="tools-button" id="tools-button" aria-label="Tools" popovertarget="tools-panel">
              <svg aria-hidden="true"><use href="/icons.svg#plug"/></svg><span class="tools-label">Tools</span>
            </button>
            <div class="tools-panel" id="tools-panel" popover>
              <fieldset id="tool-options"><legend>Tools for this chat</legend><div id="tool-switches"></div></fieldset>
            </div>
          </div>
          <div class="composer-submit">
            <label class="model-picker" title="Choose a model">
              <select id="models" aria-label="Model"><option value="">Checking models…</option></select>
              <svg class="chevron" aria-hidden="true"><use href="/icons.svg#chevron"/></svg>
            </label>
            <button type="button" class="icon stop-reply" id="stop-reply" title="Stop reply" aria-label="Stop reply" hidden><svg><use href="/icons.svg#stop"/></svg></button>
            <button type="button" class="icon" id="cancel-follow-up-edit" title="Cancel edit" aria-label="Cancel edit" hidden><svg aria-hidden="true"><use href="/icons.svg#close"/></svg></button>
            <button type="submit" class="send" id="send" title="Send message" aria-label="Send message"><svg><use href="/icons.svg#send"/></svg></button>
          </div>
        </div>
      </form>
      <div class="chat-stats" id="chat-stats" aria-label="Conversation statistics" hidden>
        <span title="Total reported prompt tokens across inference requests, including conversation history"><span id="input-tokens">—</span> input tokens</span>
        <span title="Total reported completion tokens across inference requests"><span id="output-tokens">—</span> output tokens</span>
        <span title="Generated tokens divided by generation time for requests with endpoint-reported timings">Avg <span id="token-rate">—</span> tokens/s</span>
      </div>
    </div>
    <div class="drop-layer" id="drop-layer" hidden><svg><use href="/icons.svg#image"/></svg>Drop files to attach</div>
  </main>

  <dialog id="edit-message" aria-labelledby="edit-message-title" aria-describedby="edit-message-description">
    <form id="edit-message-form">
      <div class="dialog-heading"><h2 id="edit-message-title">Edit message</h2></div>
      <div class="settings-body settings-section">
        <textarea id="edit-message-text" aria-label="Message text" rows="5" maxlength="100000" autofocus></textarea>
        <p id="edit-message-description">Sending this edit permanently removes the messages that follow it.</p>
        <p id="edit-message-error" role="alert"></p>
      </div>
      <div class="dialog-actions"><button type="button" class="secondary" id="cancel-message-edit">Cancel</button><button class="primary" id="send-message-edit">Save and send</button></div>
    </form>
  </dialog>

  <dialog id="confirm-delete" aria-labelledby="delete-title" aria-describedby="delete-description">
    <form method="dialog">
      <div class="dialog-heading"><h2 id="delete-title">Delete conversation?</h2></div>
      <div class="settings-body"><p id="delete-description"></p></div>
      <div class="dialog-actions"><button class="secondary" value="cancel" autofocus>Cancel</button><button class="danger" value="delete">Delete</button></div>
    </form>
  </dialog>
